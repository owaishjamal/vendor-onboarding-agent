# One-click deploy to Render (https://render.com). The free plan is enough.
#
#   1. Push this repo to GitHub.
#   2. Render -> New -> Blueprint -> pick the repo.
#   3. Add whichever provider keys you have in the dashboard (Environment tab)
#      for AI-written vendor emails, reviewer summaries and open-ended copilot
#      answers. Everything else — all nine checks and the verdict — is
#      deterministic and runs without any key.
#
#      The LLM router uses whatever is present and skips the rest by name, so
#      one key works and three give you failover. With a single key a free-tier
#      429 takes the feature down; with two on different providers it does not,
#      because a rate limit on one says nothing about the other.
#
# One service, one URL: the image builds the React app and FastAPI serves it
# alongside the API, so there is no separate frontend to deploy or CORS to
# configure.
#
# NOTE: the free plan has an ephemeral filesystem, so the SQLite case history
# is wiped on every restart and redeploy. SEED_DEMO_CASES=1 re-runs the
# labelled submissions on a cold start, so a visitor never lands on an empty
# dashboard. Attach a disk if you need history to survive.

services:
  - type: web
    name: vendor-onboarding
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Pace the live run view so a viewer can watch each check land.
      # Set to 0 for real throughput.
      - key: CHECK_DELAY_MS
        value: "250"
      - key: SEED_DEMO_CASES
        value: "1"
      # Provider keys. `sync: false` means Render prompts for the value and
      # stores it encrypted — it is never written into this file, which is
      # committed. Leave them all unset to run entirely on the deterministic
      # path; set one or more to enable the AI-written text.
      #
      #   Groq      https://console.groq.com/keys      fastest
      #   Cerebras  https://cloud.cerebras.ai          same weights, separate quota
      #   Gemini    https://aistudio.google.com/apikey vision + long context
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
