# One-click deploy to Render (https://render.com) — free tier works.
#
# Push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
# Render reads this file, builds the Dockerfile, and gives you a public URL.
#
# To use a real LLM instead of the offline composer, add GEMINI_API_KEY in the
# Render dashboard and set LLM_PROVIDER=gemini.
#
# NOTE: the free plan has an ephemeral filesystem — the SQLite case history is
# wiped on every restart/redeploy. SEED_DEMO_CASES=1 re-runs the labelled
# submissions on a cold start so the dashboard is never empty for a visitor.

services:
  - type: web
    name: vendor-onboarding
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: offline
      - key: CHECK_DELAY_MS
        value: "250"
      - key: SEED_DEMO_CASES
        value: "1"
    healthCheckPath: /health
