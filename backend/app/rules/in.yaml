country: IN
country_name: India

tax_id:
  label: GSTIN
  # 2-digit state code, 10-char PAN, entity digit, 'Z', checksum char.
  # The embedded PAN is what makes this format worth validating properly:
  # a GSTIN that does not contain a well-formed PAN is not a real GSTIN.
  regex: "^\\d{2}[A-Z]{5}\\d{4}[A-Z]\\d[Z][A-Z\\d]$"
  example: "27AAPFU0939F1ZV"
  hint: "Your 15-character GSTIN, e.g. 27AAPFU0939F1ZV."

registration_number:
  label: CIN (Corporate Identity Number)
  regex: "^[LUu]\\d{5}[A-Z]{2}\\d{4}[A-Z]{3}\\d{6}$"
  example: "U74999MH2015PTC269898"
  required: false

bank:
  scheme: ifsc          # IFSC + account number
  account_number:
    regex: "^\\d{9,18}$"
  ifsc:
    label: IFSC code
    regex: "^[A-Z]{4}0[A-Z0-9]{6}$"
  swift_bic:
    regex: "^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$"

pan:
  label: PAN (Permanent Account Number)
  # 5 letters, 4 digits, 1 letter. The 4th letter encodes the holder type
  # (C=company, P=individual, F=firm...), which is why it is worth validating
  # properly rather than just checking the length.
  regex: "^[A-Z]{5}[0-9]{4}[A-Z]$"
  example: "AAPFU0939F"

required_documents:
  - doc_type: tax_form
    label: GST registration certificate
    accepted: [gst_certificate]
  - doc_type: pan_card
    label: PAN card
    accepted: [pan_card]
  - doc_type: incorporation
    label: Certificate of Incorporation
    accepted: [certificate_of_incorporation]
  - doc_type: bank_proof
    label: Cancelled cheque or bank letter showing account name
    accepted: [cancelled_cheque, bank_letter, bank_statement]

free_email_domains_allowed: false
