country: SG
country_name: Singapore

tax_id:
  label: GST registration number
  regex: "^(M\\d{8}[A-Z]|\\d{8,9}[A-Z])$"
  example: "200912345K"
  hint: "Your GST registration number, e.g. 200912345K."

registration_number:
  label: UEN (Unique Entity Number)
  regex: "^(\\d{8,9}[A-Z]|[TSR]\\d{2}[A-Z]{2}\\d{4}[A-Z])$"
  example: "201512345D"
  required: true

bank:
  scheme: swift_account
  account_number:
    regex: "^\\d{7,14}$"
  swift_bic:
    regex: "^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$"

required_documents:
  - doc_type: incorporation
    label: ACRA business profile
    accepted: [acra_bizfile, certificate_of_incorporation]
  - doc_type: bank_proof
    label: Bank letter showing account holder name
    accepted: [bank_letter, bank_statement]

free_email_domains_allowed: false
